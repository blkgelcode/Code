<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BLKGRLCO Bin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <button class="side-toggle" id="side-toggle" title="Show or hide projects" aria-label="Show or hide projects">☰</button>
    <div class="brand">BLKGRLCO <span>Bin</span></div>
    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="media" class="active">Media</button>
      <button role="tab" data-tab="plan">Plan</button>
      <button role="tab" data-tab="overview">Overview</button>
      <button role="tab" data-tab="settings">Settings</button>
    </nav>
    <div class="project-pill">
      <span id="project-name" title="">No project open</span>
      <button class="btn small light" id="pick-btn">Pick folder</button>
    </div>
  </header>

  <div class="shell">
  <aside id="sidebar" class="sidebar" aria-label="Projects"></aside>
  <main>
    <section id="tab-media" class="tab-panel active"></section>
    <section id="tab-plan" class="tab-panel"></section>
    <section id="tab-overview" class="tab-panel"></section>
    <section id="tab-settings" class="tab-panel"></section>
  </main>
  </div>

  <div id="modal" class="modal hidden" role="dialog" aria-modal="true"><div class="modal-box"></div></div>
  <div id="toast" class="toast hidden"></div>
  <script src="/app.js"></script>
  <script src="/plan.js"></script>
  <script src="/overview.js"></script>
</body>
</html>
