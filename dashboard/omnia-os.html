<title>Omnia OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#F4F4F6; --cream:#ECECF1; --card:#FFFFFF; --card-2:#F4F4F6; --ink:#111114; --ink-2:#5F5F66; --ink-3:#9A9AA3;
  --line:#E7E7EC; --sage:#3AA76D; --sage-ink:#1F7A4B; --blush:#E8607A; --blush-ink:#B3304C; --tan:#D08A3B; --tan-ink:#9A5F1E;
  --wine:#8C0532; --wine-soft:#FBE8EE; --ox:#49001B; --shift:#EBEBEF; --shift-ink:#6E6E76; --focus:#8C0532;
  --shadow:0 1px 2px rgba(17,17,20,.04),0 8px 24px rgba(17,17,20,.06);
  --serif:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:20px; --nav-h:64px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0E0E10; --cream:#1A1A1E; --card:#18181C; --card-2:#222226; --ink:#F2F2F5; --ink-2:#A9A9B3; --ink-3:#6F6F79;
    --line:#2A2A30; --sage:#4CC287; --sage-ink:#7BD9A8; --blush:#F07B92; --blush-ink:#F5A3B3; --tan:#E39B4C; --tan-ink:#F0BF86;
    --wine:#E24B77; --wine-soft:#3A1220; --ox:#F5B8CB; --shift:#232328; --shift-ink:#9A9AA5; --focus:#F07B92;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E0E10; --cream:#1A1A1E; --card:#18181C; --card-2:#222226; --ink:#F2F2F5; --ink-2:#A9A9B3; --ink-3:#6F6F79;
  --line:#2A2A30; --sage:#4CC287; --sage-ink:#7BD9A8; --blush:#F07B92; --blush-ink:#F5A3B3; --tan:#E39B4C; --tan-ink:#F0BF86;
  --wine:#E24B77; --wine-soft:#3A1220; --ox:#F5B8CB; --shift:#232328; --shift-ink:#9A9AA5; --focus:#F07B92;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}
.tnum{font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* shell */
.shell{display:grid;grid-template-columns:1fr;min-height:100%}
.side{display:none}
.main{min-width:0;padding-inline:16px;padding-block:14px calc(var(--nav-h) + 24px + env(safe-area-inset-bottom,0px))}
@media (min-width:900px){
  .shell{grid-template-columns:200px minmax(0,1fr)}
  .side{display:flex;flex-direction:column;gap:4px;padding:26px 14px;background:var(--card-2);position:sticky;top:0;height:100vh}
  .main{padding-inline:32px;padding-block:22px 48px;max-width:1240px}
  .bottomnav{display:none}
}
.side .brandmark{font-size:22px;font-weight:700;letter-spacing:-.03em;line-height:1;margin:4px 8px 18px}
.navbtn{display:flex;align-items:center;gap:10px;border:0;background:none;border-radius:12px;padding:9px 10px;text-align:left;cursor:pointer;color:var(--ink-2);font-weight:500}
.navbtn[aria-selected=true]{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.navbtn .k{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-left:auto}
.navbtn .badge{margin-left:auto;background:var(--wine);color:#fff;border-radius:999px;font-size:10px;padding:1px 7px;font-weight:600}
.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(8,1fr);background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:saturate(1.6) blur(18px);-webkit-backdrop-filter:saturate(1.6) blur(18px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
.bottomnav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:9.5px;color:var(--ink-3);padding:4px 0;cursor:pointer;position:relative;letter-spacing:.02em}
.bottomnav button[aria-selected=true]{color:var(--wine);font-weight:600}
.bottomnav button i{width:26px;height:22px;display:grid;place-items:center;font-size:12px;font-weight:700;letter-spacing:-.02em;line-height:1;border-radius:7px;font-style:normal}
.bottomnav button[aria-selected=true] i{background:var(--wine);color:#fff}
.bottomnav button .badge{position:absolute;top:0;right:calc(50% - 18px);background:var(--wine);color:#fff;border-radius:999px;font-size:9px;padding:0 5px;font-weight:600}

/* header + ask */
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:6px 20px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.head h1{font-weight:700;font-size:clamp(30px,6.5vw,40px);line-height:1;margin:0;letter-spacing:-.03em}
.head .meta{text-align:right;font-size:15px;font-weight:500;line-height:1.2;color:var(--ink-2)}
.head .meta b{display:block;font-family:var(--sans);font-size:10.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.head .meta .day{color:var(--wine);font-weight:600}
.askwrap{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:var(--bg);padding:10px 0 12px;margin:0 0 6px}
.ask{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid transparent;border-radius:999px;padding:6px 6px 6px 16px;box-shadow:var(--shadow)}
.ask input{flex:1;min-width:0;border:0;background:none;font-size:15px;padding:6px 0}
.ask input::placeholder{color:var(--ink-3);font-size:15px}
.ask button{border:0;background:var(--wine);color:var(--card);border-radius:999px;width:38px;height:38px;cursor:pointer;flex:none;font-size:16px}
.ask button[disabled]{opacity:.4;cursor:not-allowed}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 2px 0;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 11px;font-size:11.5px;color:var(--ink-2);cursor:pointer;white-space:nowrap}
.chip:hover{border-color:var(--tan)}

/* assistant thread */
.thread{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.msg{max-width:100%;border-radius:16px;padding:10px 14px;font-size:13.5px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.user{align-self:flex-end;background:var(--wine);color:#fff;border-bottom-right-radius:6px;max-width:85%}
.msg.ai{align-self:stretch;background:var(--card);box-shadow:var(--shadow);border-bottom-left-radius:6px}
.msg.ai.thinking{color:var(--ink-3)}
.msg .tools{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.msg .tools span{font-size:10.5px;background:var(--card-2);border-radius:999px;padding:1px 8px;color:var(--ink-2)}
.threadbar{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:11px;color:var(--ink-3)}
.preview{border:1.5px solid var(--wine);background:var(--card);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.preview .lbl{color:var(--wine)}
.preview h4{margin:0;font-size:16px;font-weight:600;line-height:1.2}
.preview .kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:12.5px}
.preview .kv b{font-weight:500;color:var(--ink-3)}
.preview textarea,.preview input{width:100%;border:1px solid var(--line);border-radius:10px;padding:6px 9px;background:var(--bg);font-size:13px}
.preview .acts{display:flex;gap:6px;flex-wrap:wrap}
.preview.done{border-color:var(--sage);opacity:.85}
.preview.cancelled{border-color:var(--line);opacity:.6}

/* generic */
.grid{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;align-items:start}
@media (min-width:720px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.span2{grid-column:span 2}}
@media (min-width:1180px){.grid.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g3 .span3{grid-column:span 3}}
.card{background:var(--card);border:1px solid transparent;box-shadow:var(--shadow);border-radius:var(--r);padding:16px 16px 14px;display:flex;flex-direction:column;gap:11px;min-width:0}
.card h2{font-size:19px;font-weight:600;line-height:1.1;margin:0;letter-spacing:-.02em}
.chead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.lbl{font-size:10.5px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3)}
.sub{font-size:12px;color:var(--ink-2)}
.stale{font-size:11px;color:var(--ink-3)}
.empty{font-size:13px;color:var(--ink-3);padding:4px 0}
.hr{height:1px;background:var(--line);border:0;margin:0}
.big{font-size:30px;font-weight:700;line-height:1;letter-spacing:-.03em}
.big small{font-size:15px;color:var(--ink-3);font-weight:500;letter-spacing:0}
.btn{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 13px;cursor:pointer;font-size:12px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--tan)}
.btn.solid{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.wine{background:var(--wine);color:#fff;border-color:var(--wine)}
.btn.ghost{background:none}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.sm{padding:3px 9px;font-size:11px}
.linkbtn{border:0;background:none;padding:0;font-size:11.5px;color:var(--ink-3);cursor:pointer;text-decoration:underline}
.field{border:1px solid transparent;background:var(--card-2);border-radius:12px;padding:7px 10px;font-size:13px;min-width:0}
.field:focus{border-color:var(--wine);background:var(--card)}
textarea.field{resize:vertical;min-height:70px;width:100%}
.addrow{display:flex;flex-wrap:wrap;gap:6px}
.addrow .field{flex:1 1 140px}
.addrow select.field,.addrow input[type=date].field,.addrow input[type=number].field{flex:0 1 auto}
.check{appearance:none;width:18px;height:18px;border:1.5px solid var(--ink-3);border-radius:5px;flex:none;cursor:pointer;display:grid;place-items:center;margin:0;background:var(--card)}
.check:checked{background:var(--sage);border-color:var(--sage)}
.check:checked::after{content:"";width:5px;height:9px;border:solid var(--card);border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);min-width:0}
.row:last-child{border-bottom:0}
.row .t{flex:1;min-width:0;overflow-wrap:anywhere}
.row .t small{display:block;font-size:11px;color:var(--ink-3)}
.row.done .t{color:var(--ink-3);text-decoration:line-through}
.x{border:0;background:none;color:var(--ink-3);cursor:pointer;font-size:16px;line-height:1;padding:2px 4px}
.x:hover{color:var(--wine)}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:1px 8px;font-size:10.5px;font-weight:500;white-space:nowrap;line-height:17px}
.b1{background:color-mix(in srgb,var(--blush) 16%,transparent);color:var(--blush-ink)} .b2{background:color-mix(in srgb,var(--sage) 16%,transparent);color:var(--sage-ink)} .b3{background:color-mix(in srgb,var(--tan) 18%,transparent);color:var(--tan-ink)} .b0{background:var(--card-2);color:var(--ink-2)}
.lHot{background:color-mix(in srgb,var(--blush) 16%,transparent);color:var(--blush-ink)} .lHealthy{background:color-mix(in srgb,var(--sage) 16%,transparent);color:var(--sage-ink)} .lHappy{background:color-mix(in srgb,var(--tan) 18%,transparent);color:var(--tan-ink)}
.bar{height:5px;border-radius:5px;background:var(--line);overflow:hidden}
.bar > i{display:block;height:100%;border-radius:5px;background:var(--sage)}
.bar.tan > i{background:var(--tan)} .bar.blush > i{background:var(--blush)} .bar.wine > i{background:var(--wine)}
.tabs{display:inline-flex;background:var(--cream);border-radius:999px;padding:3px;gap:2px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:none;border-radius:999px;padding:4px 11px;font-size:12px;font-weight:500;cursor:pointer;color:var(--ink-2);white-space:nowrap}
.tabs button[aria-selected=true]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(17,17,20,.12)}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--card);padding:8px 16px;border-radius:999px;font-size:12.5px;z-index:30;max-width:calc(100% - 32px)}
@media (min-width:900px){.toast{bottom:22px}}
.notice{font-size:12px;color:var(--ink-2);background:var(--card-2);border-radius:10px;padding:8px 12px}
.notice.wine{color:var(--wine);background:var(--wine-soft)}
.connect{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:11.5px;color:var(--ink-3)}
.connect .src{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:999px;padding:2px 9px;background:var(--card)}
.connect .src.bad{border-color:var(--wine);color:var(--wine)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--ink-3)}
.dot.ok{background:var(--sage)} .dot.bad{background:var(--wine)} .dot.busy{background:var(--tan);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}

/* flags */
.flag{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid color-mix(in srgb,var(--wine) 22%,transparent)}
.flag:last-child{border-bottom:0}
.flag .fi{flex:none;width:8px;height:8px;border-radius:50%;background:var(--wine);margin-top:6px}
.flag .ft{flex:1;min-width:0;font-size:13px;color:var(--ink)}
.flag .ft small{display:block;color:var(--ink-2);font-size:11.5px}
.flagcard{border-color:transparent;box-shadow:var(--shadow),inset 4px 0 0 var(--wine)}
.flagcard h2{color:var(--wine)}

/* brief */

.brief .kvs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kv-t{background:var(--card-2);border-radius:14px;padding:10px 12px;min-width:0}
.kv-t b{display:block;font-size:clamp(15px,4.6vw,20px);font-weight:700;line-height:1.05;letter-spacing:-.03em;white-space:nowrap}
.kv-t span{font-size:10.5px;color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase}
.prio{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.prio:last-child{border-bottom:0}
.prio .n{font-size:12px;font-weight:700;color:#fff;background:var(--wine);width:22px;height:22px;border-radius:50%;display:grid;place-items:center;flex:none}
.coach{border-left:3px solid var(--wine);padding:4px 0 4px 12px;font-size:15px;font-weight:500;line-height:1.4}
.routines{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (min-width:560px){.routines{grid-template-columns:repeat(4,minmax(0,1fr))}}
.routine{border:1px solid transparent;border-radius:16px;padding:12px 14px;background:var(--card-2);cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:2px}
.routine:hover{border-color:var(--tan)}
.routine b{font-size:14px;font-weight:600;line-height:1.2}
.routine span{font-size:11px;color:var(--ink-3)}
.routine.hot{border-color:var(--wine);background:var(--wine-soft)}

/* timeline */
.tl{position:relative;margin-left:42px;border-left:1px solid var(--line)}
.tl .hl{position:absolute;left:-42px;width:36px;text-align:right;font-size:10px;color:var(--ink-3);transform:translateY(-6px)}
.tl .hg{position:absolute;left:0;right:0;border-top:1px dashed var(--line)}
.blk{position:absolute;left:6px;right:6px;border-radius:10px;padding:5px 9px;font-size:11.5px;overflow:hidden}
.blk b{font-weight:600;display:block}
.blk.shift{background:var(--shift);color:var(--shift-ink)}
.blk.capture{background:color-mix(in srgb,var(--sage) 12%,transparent);color:var(--sage-ink);border:1px solid color-mix(in srgb,var(--sage) 35%,transparent)}
.blk.batch{background:color-mix(in srgb,var(--blush) 12%,transparent);color:var(--blush-ink);border:1px solid color-mix(in srgb,var(--blush) 35%,transparent)}
.blk.sunday{background:color-mix(in srgb,var(--tan) 14%,transparent);color:var(--tan-ink);border:1px solid color-mix(in srgb,var(--tan) 35%,transparent)}
.blk.ev{left:30%;background:var(--card);border:1px solid var(--line);z-index:2;box-shadow:var(--shadow)}
.blk.ev.conflict{border-color:var(--wine);color:var(--wine)}
.blk.now{left:0;right:0;border-top:1.5px solid var(--wine);padding:0;border-radius:0;z-index:3}
.blk.now::before{content:"";position:absolute;left:-4px;top:-4px;width:7px;height:7px;border-radius:50%;background:var(--wine)}

/* week */
.wkgrid{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
@media (min-width:900px){.wkgrid{grid-template-columns:repeat(7,minmax(0,1fr))}}
.wkday{background:var(--card);border:1px solid transparent;box-shadow:var(--shadow);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:6px;min-height:120px;min-width:0}
.wkday.today{border-color:var(--wine)}
.wkday.over{background:var(--card-2);border-style:dashed}
.wkday .dh{display:flex;justify-content:space-between;align-items:baseline}
.wkday .dh b{font-size:22px;font-weight:700;line-height:1;letter-spacing:-.03em}
.wkday .dh span{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.wkday .type{font-size:10.5px;border-radius:6px;padding:2px 7px;align-self:flex-start}
.type.work{background:var(--shift);color:var(--shift-ink)} .type.sat{background:color-mix(in srgb,var(--blush) 16%,transparent);color:var(--blush-ink)} .type.sun{background:color-mix(in srgb,var(--tan) 18%,transparent);color:var(--tan-ink)} .type.vac{background:color-mix(in srgb,var(--sage) 16%,transparent);color:var(--sage-ink)}
.wi{display:flex;gap:6px;align-items:flex-start;border-radius:10px;padding:6px 8px;font-size:11.5px;background:var(--card-2);border:0;cursor:grab;min-width:0;line-height:1.3}
.wi:active{cursor:grabbing}
.wi i{flex:none;width:4px;align-self:stretch;border-radius:3px;background:var(--ink-3)}
.wi.b1 i{background:var(--blush)} .wi.b2 i{background:var(--sage)} .wi.b3 i{background:var(--tan)} .wi.body i{background:var(--sage-ink)} .wi.life i{background:var(--ink-3)} .wi.cal i{background:var(--ink)}
.wi .t{flex:1;min-width:0;overflow-wrap:anywhere}
.wi.done .t{text-decoration:line-through;color:var(--ink-3)}
.wi .mv{border:0;background:none;color:var(--ink-3);cursor:pointer;padding:0 2px;font-size:12px}
.wi.dragging{opacity:.4}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:11px;color:var(--ink-3)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:12px;height:4px;border-radius:3px;display:inline-block}

/* studio kanban */
.kan{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x proximity}
.col{flex:0 0 200px;background:var(--card-2);border:1px solid transparent;border-radius:14px;padding:9px;display:flex;flex-direction:column;gap:6px;min-height:110px;scroll-snap-align:start}
.col.over{border-style:dashed;border-color:var(--tan)}
.col h4{margin:0;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);display:flex;justify-content:space-between}
.kc{background:var(--card);border:1px solid transparent;box-shadow:0 1px 3px rgba(17,17,20,.08);border-radius:12px;padding:8px 9px;font-size:12.5px;display:flex;flex-direction:column;gap:4px;cursor:grab}
.kc .t{font-weight:500;overflow-wrap:anywhere}
.kc .m{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:10.5px;color:var(--ink-3)}
.kc .m a{text-decoration:none;border-bottom:1px dotted var(--ink-3)}
.kc.overdue{border-color:var(--wine)}
.kc .mv{align-self:flex-end;border:0;background:none;color:var(--ink-3);cursor:pointer;font-size:11px;padding:0}
.brandtabs{display:flex;gap:6px;flex-wrap:wrap}
.detail{position:fixed;inset:0;background:rgba(46,21,0,.35);z-index:40;display:grid;place-items:end center;padding:0}
@media (min-width:720px){.detail{place-items:center;padding:20px}}

async function ask(text, opts = {}) {

  const live = { role: "assistant", content: "", tools: [], thinking: true }; thread.push(live); renderThread();
  const turns = thread.filter(m => !m.thinking && m.role).slice(-12).map(m => ({ role: m.role, content: m.content }));
  if (opts.hidden) turns.push({ role: "user", content: text });
  if (turns[0].role !== "user") turns.unshift({ role: "user", content: "(context)" });
  const noTools = sampleTools === false;
  turns[0] = { role: "user", content: `${SYSTEM}\n\nCURRENT STATE\n${contextBlock()}\n${noTools ? "\nNOTE: page tools are NOT available in this view. Answer in text; when she asks you to log or move something, give her the exact change to make on the page instead of claiming you did it." : ""}\n---\n${turns[0].content}` };

function taskRow(t) { return `<div class="row ${t.done ? "done" : ""}"><input type="checkbox" class="check" id="tk-${t.id}" data-act="task-toggle" data-id="${t.id}" ${t.done ? "checked" : ""}><label class="t" for="tk-${t.id}">${esc(t.title)}${t.date && t.date !== TODAY() ? `<small>${t.date < TODAY() ? "overdue · " : ""}${fmt(parseD(t.date), { weekday: "short", month: "short", day: "numeric" })}</small>` : ""}</label>${BRANDS[t.brand] ? `<span class="pill ${BRANDS[t.brand].cls}">${BRANDS[t.brand].pill}</span>` : ""}<button class="x" data-act="task-rm" data-id="${t.id}" aria-label="Remove">×</button></div>`; }
function timeline(d) {
  const ds = ymd(d), t = dayType(d), H0 = 6, H1 = 24, PX = 26, top = h => (h - H0) * PX;
  let b = "";
  if (t === "work") b += `<div class="blk capture" style="top:${top(CAPTURE_START)}px;height:${(SHIFT[0] - CAPTURE_START) * PX - 4}px"><b>Capture window</b>Opportunistic only: today's short, b-roll, a talking head</div><div class="blk shift" style="top:${top(SHIFT[0])}px;height:${(SHIFT[1] - SHIFT[0]) * PX - 2}px"><b>MEM · ground ops</b>3pm – 12am</div>`;
  else if (t === "sat") b += `<div class="blk batch" style="top:${top(9)}px;height:${9 * PX - 4}px"><b>Batch film day</b>Work the shot list, location by location</div>`;
  else if (t === "sun") b += `<div class="blk sunday" style="top:${top(9)}px;height:${10 * PX - 4}px"><b>Edit · Upload · Reflect · Plan</b>Edit the week's shorts (Monthly Vlog at month end), queue Metricool, Sunday Plan</div>`;
  else b += `<div class="blk capture" style="top:${top(9)}px;height:${9 * PX - 4}px"><b>Vacation</b>Travel filming allowed</div>`;
  for (const ev of eventsOn(ds).filter(e => !e.allDay)) {
    const s = new Date(ev.start), e = ev.end ? new Date(ev.end) : new Date(+s + 36e5);
    const sh = Math.max(H0, s.getHours() + s.getMinutes() / 60), eh = Math.min(H1, ymd(e) !== ds ? 24 : e.getHours() + e.getMinutes() / 60); if (eh <= H0) continue;
    const conflict = t === "work" && sh >= SHIFT[0];
    b += `<div class="blk ev ${conflict ? "conflict" : ""}" style="top:${top(sh)}px;height:${Math.max(22, (eh - sh) * PX - 2)}px"><b>${esc(ev.title)}</b>${fmtTime(s)} – ${fmtTime(e)}</div>`;
  }
  for (const x of ptOn(ds)) { const [hh, mm] = x.time.split(":").map(Number), sh = hh + (mm || 0) / 60; if (sh >= H0 && sh < H1) b += `<div class="blk ev" style="top:${top(sh)}px;height:${PX - 2}px;left:48%;border-color:var(--sage-ink);color:var(--sage-ink)"><b>PT · Crunch${x.done ? " ✓" : x.skipped ? " · skipped" : ""}</b>${fmtTime(new Date(2000, 0, 1, hh, mm || 0))}</div>`; }
  if (ds === TODAY()) { const h = NOW.getHours() + NOW.getMinutes() / 60; if (h >= H0 && h <= H1) b += `<div class="blk now" style="top:${top(h)}px"></div>`; }
  let g = ""; for (let h = H0; h <= H1; h += 2) g += `<div class="hl" style="top:${top(h)}px">${hourLabel(h)}</div><div class="hg" style="top:${top(h)}px"></div>`;
  const all = eventsOn(ds).filter(e => e.allDay);
  return `${all.length ? `<div class="sub">${all.map(e => `<span class="pill b0">${esc(e.title)}</span>`).join(" ")}</div>` : ""}<div class="tl" style="height:${(H1 - H0) * PX}px">${g}${b}</div>`;
}

  const missed = []; for (const k of keys) for (const g of hhh(k.slice(4)).goals) if (g.missed || (k !== "hhh-" + WEEKKEY() && g.count < g.target)) missed.push({ ...g, wk: k.slice(4), key: k });

  return `<div class="grid g3">
    <section class="card"><div class="chead"><h2>90-Day Run</h2><span class="lbl">Day 1 · ${fmt(parseD(START_DATE), { month: "short", day: "numeric" })}</span></div>
      <div class="ringrow"><svg class="ring" width="84" height="84" viewBox="0 0 84 84" aria-hidden="true"><circle class="track" cx="42" cy="42" r="34" fill="none" stroke-width="7"/><circle class="val" cx="42" cy="42" r="34" fill="none" stroke-width="7" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - frac)}" transform="rotate(-90 42 42)"/><text x="42" y="47" text-anchor="middle" font-size="16" font-weight="600" fill="currentColor" font-family="Inter,system-ui,sans-serif">${Math.round(frac * 100)}%</text></svg>
        <div><div class="big tnum">Day ${Math.max(1, Math.min(day, RUN_DAYS))} <small>of 90</small></div><div class="sub">${Math.max(0, RUN_DAYS - day)} to go · finale ${fmt(addDays(parseD(START_DATE), RUN_DAYS - 1), { month: "short", day: "numeric" })}</div></div></div>
      <div class="lbl">Daily streak · live post or lift</div><div class="streak">${streak.map(s => `<i class="${s.on ? "on" : s.today ? "" : "miss"} ${s.today ? "today" : ""}" title="${s.ds}"></i>`).join("")}</div>
      <div class="sub tnum">${streak.filter(s => s.on).length} of ${streak.length} days with a live post or a lift.</div></section>
    <section class="card span2"><div class="chead"><h2>This week's goals</h2><span class="sub">Week of ${fmt(WEEK0(), { month: "short", day: "numeric" })} · specific and countable</span></div>
      <div class="grid" style="grid-template-columns:repeat(3,minmax(0,1fr));gap:10px">${LANES.map(l => { const gs = wk.goals.filter(g => g.lane === l); return `<div><div class="pill l${l}" style="margin-bottom:4px">${l}</div>${gs.map(goalRow).join("") || `<div class="empty" style="font-size:14px">None set</div>`}</div>`; }).join("")}</div>
      <form class="addrow" data-form="goal"><select class="field" id="goal-lane">${LANES.map(l => `<option>${l}</option>`).join("")}</select><input class="field" id="goal-text" placeholder="Countable goal" required autocomplete="off"><input class="field tnum" id="goal-target" type="number" min="1" max="21" value="3" aria-label="Times"><button class="btn solid">Add</button></form>
      <div class="threadbar"><span>Missed goals stay on the board until you name them on camera.</span><button class="linkbtn" data-act="ask" data-v="Set this week's HHH goals with me">Set with Claude</button></div></section>
    <section class="card"><div class="chead"><h2>Missed goals log</h2><span class="lbl">${missed.length}</span></div>
      <div>${missed.map(g => `<div class="goal missed"><div class="t">${esc(g.text)}</div><span class="stale tnum">${g.count}/${g.target} · ${fmt(parseD(g.wk), { month: "short", day: "numeric" })}</span><div class="gfoot"><span class="pill l${g.lane}">${g.lane}</span>${g.named ? `<span class="stale">named on camera ✓</span>` : `<span class="tag-miss">Name it on camera</span><button class="linkbtn" data-act="goal-named" data-id="${g.id}" data-wk="${g.key}">Named it</button>`}</div></div>`).join("") || `<div class="empty">Nothing missed yet.</div>`}</div></section>
    <section class="card span2"><div class="chead"><h2>Pin Board</h2><span class="lbl">${fmt(NOW, { month: "long" })} goals</span></div>
      <div class="pins">${pins.items.map(it => `<figure class="pin" style="margin:0"><img src="/_blob/${esc(it.assetId)}" alt="${esc(it.caption || "Pin Board photo")}" loading="lazy"><button class="rm" data-act="pin-rm" data-id="${it.id}">Remove</button><figcaption class="cap"><input id="pc-${it.id}" data-act="pin-cap" data-id="${it.id}" value="${esc(it.caption || "")}" placeholder="Name this goal"></figcaption></figure>`).join("")}
        ${assets ? `<button class="pin add" data-act="pin-add" id="pin-drop">+ Add photo<br><span class="stale">or drop one here</span></button>` : `<div class="pin ph">${capsResolved ? "Uploads open for the owner" : "Loading…"}</div>`}
        ${Array.from({ length: Math.max(0, 3 - pins.items.length) }, () => `<div class="pin ph">Goal</div>`).join("")}</div>
      <hr class="hr"><div class="chead"><span class="lbl">${NOW.getFullYear()} goals</span><span class="lbl tnum">${yearly.items.filter(i => i.done).length}/${yearly.items.length}</span></div>
      <div class="rows">${yearly.items.map(it => `<div class="row ${it.done ? "done" : ""}"><input type="checkbox" class="check" id="yg-${it.id}" data-act="year-done" data-id="${it.id}" ${it.done ? "checked" : ""}><label class="t" for="yg-${it.id}">${esc(it.text)}</label><button class="x" data-act="year-rm" data-id="${it.id}" aria-label="Remove">×</button></div>`).join("") || `<div class="empty">Add the goals this year is for.</div>`}</div>
      <form class="addrow" data-form="year"><input class="field" id="year-text" placeholder="Yearly goal" required autocomplete="off"><button class="btn solid">Add</button></form></section>
  </div>`;
}
function goalRow(g) { const hit = g.count >= g.target, missed = g.missed && !hit; return `<div class="goal ${hit ? "hit" : ""} ${missed ? "missed" : ""}"><div class="t">${esc(g.text)}</div><div class="ctr"><button data-act="goal-dec" data-id="${g.id}" aria-label="One less">−</button><span class="tnum">${g.count}/${g.target}</span><button data-act="goal-inc" data-id="${g.id}" aria-label="One more">+</button></div><div class="bar"><i style="width:${Math.min(100, g.count / g.target * 100)}%"></i></div>${!hit ? `<div class="gfoot">${missed ? `<span class="tag-miss">Name it on camera</span>` : ""}<button class="linkbtn" data-act="goal-miss" data-id="${g.id}">${missed ? "Undo missed" : "Mark missed"}</button></div>` : ""}</div>`; }

/* ---- BODY ---- */
function pageBody() {
  const b = body(), td = b.days[TODAY()] || {}, lifts = Object.values(b.days).filter(d => d.lift).length;
  const band = (v, lo, hi, max) => `<div class="band"><span class="zone" style="left:${lo / max * 100}%;width:${(hi - lo) / max * 100}%"></span>${v ? `<span class="mk" style="left:calc(${Math.min(100, v / max * 100)}% - 1.5px)"></span>` : ""}</div>`;
  const weeks = bodyKeys().reverse().map(k => { const w = store.get(k, { days: {} }); const ds = Object.values(w.days); const p = ds.filter(d => d.protein); return { wk: k.slice(5), lifts: ds.filter(d => d.lift).length, protein: p.length ? Math.round(p.reduce((a, d) => a + d.protein, 0) / p.length) : 0 }; });
  return `<div class="grid g3">
    <section class="card"><div class="chead"><h2>Lifts</h2><span class="lbl tnum">${lifts} / ${WORKOUT_TARGET[0]}–${WORKOUT_TARGET[1]}</span></div>
      <div class="hwk">${[0, 1, 2, 3, 4, 5, 6].map(i => { const d = addDays(WEEK0(), i), ds = ymd(d); return `<button class="${b.days[ds]?.lift ? "on" : ""} ${ds === TODAY() ? "today" : ""}" data-act="lift" data-v="${ds}" aria-pressed="${!!b.days[ds]?.lift}">${fmt(d, { weekday: "narrow" })}<i></i></button>`; }).join("")}</div>
      <div class="sub">${lifts >= 4 ? "Four in. That's the week." : lifts >= 3 ? "In range. One more is the stretch." : `${3 - lifts} more to reach 3. Crunch or PT.`}</div>
      <input class="field" id="lift-name" placeholder="Today’s session (legs, upper, PT, Crunch app day 2…)" value="${esc(td.name || "")}"></section>
    <section class="card"><div class="chead"><h2>Protein & calories</h2><span class="lbl">today</span></div>
      <div class="kvl"><span class="lbl">Protein</span><span><input class="field tnum" id="h-protein" type="number" inputmode="numeric" placeholder="0" value="${td.protein || ""}" style="width:80px;text-align:right"> g</span></div>${band(td.protein, PROTEIN[0], PROTEIN[1], 200)}<div class="kvl"><span>Target ${PROTEIN[0]}–${PROTEIN[1]}g · ZOZOFIT</span><span class="tnum">${td.protein ? (td.protein >= PROTEIN[0] ? "Hit" : PROTEIN[0] - td.protein + "g to go") : "Not logged"}</span></div>
      <div class="kvl"><span class="lbl">Calories</span><span><input class="field tnum" id="h-cal" type="number" inputmode="numeric" placeholder="0" value="${td.cal || ""}" style="width:80px;text-align:right"></span></div>${band(td.cal, CALORIES[0], CALORIES[1], 3000)}<div class="kvl"><span>Target ~${CALORIES[0].toLocaleString()}–${CALORIES[1].toLocaleString()}</span><span class="tnum">${td.cal ? (td.cal > CALORIES[1] ? td.cal - CALORIES[1] + " over" : td.cal >= CALORIES[0] ? "In range" : CALORIES[0] - td.cal + " to go") : "Not logged"}</span></div></section>
    <section class="card"><div class="chead"><h2>Personal training</h2><span class="lbl">Crunch · ${pt().sessions.filter(x => x.date >= TODAY() && !x.done && !x.skipped).length} booked</span></div>
      ${(() => { const past = pt().sessions.filter(x => x.date < TODAY() && !x.done && !x.skipped).sort((a, b2) => a.date.localeCompare(b2.date)); return past.length ? `<div class="notice wine">Did you make it? ${past.map(x => `<span style="white-space:nowrap">${fmt(parseD(x.date), { weekday: "short", month: "short", day: "numeric" })} <button class="btn sm" data-act="pt-done" data-id="${x.id}">Went</button> <button class="btn sm ghost" data-act="pt-skip" data-id="${x.id}">Skipped</button></span>`).join(" ")}</div>` : ""; })()}
      <div class="rows">${pt().sessions.filter(x => x.date >= TODAY()).sort((a, b2) => a.date.localeCompare(b2.date)).slice(0, 8).map(x => `<div class="row ${x.done ? "done" : ""}"><input type="checkbox" class="check" id="pt-${x.id}" data-act="pt-toggle" data-id="${x.id}" ${x.done ? "checked" : ""} aria-label="Done"><label class="t" for="pt-${x.id}">${x.date === TODAY() ? "Today" : fmt(parseD(x.date), { weekday: "long" })}<small>${fmt(parseD(x.date), { month: "short", day: "numeric" })} · ${fmtTime(new Date(2000, 0, 1, ...x.time.split(":").map(Number)))}${x.skipped ? " · skipped" : ""}</small></label><button class="x" data-act="pt-rm" data-id="${x.id}" aria-label="Remove">×</button></div>`).join("") || `<div class="empty">No sessions booked. Add the next ones from the Crunch app.</div>`}</div>
      <form class="addrow" data-form="pt"><input class="field" id="pt-date" type="date" required><input class="field" id="pt-time" type="time" value="11:30"><button class="btn solid">Book</button></form>
      <div class="stale">Ticking a session logs it as a lift. Sessions come from the Crunch app; add them here when you book.</div></section>
    <section class="card"><div class="chead"><h2>Six-week trend</h2><span class="lbl">lifts · avg protein</span></div>
      <div class="trend">${weeks.map(w => `<div><i style="height:${w.lifts / 5 * 54 + 2}px" class="${w.lifts < 3 ? "low" : ""}" title="${w.lifts} lifts"></i>${fmt(parseD(w.wk), { month: "numeric", day: "numeric" })}</div>`).join("")}</div>
      <div class="rows">${weeks.map(w => `<div class="kvl tnum" style="padding:3px 0"><span>Week of ${fmt(parseD(w.wk), { month: "short", day: "numeric" })}</span><span>${w.lifts} lifts · ${w.protein ? w.protein + "g" : "—"}</span></div>`).join("")}</div></section>
  </div>`;
}

/* ---- MONEY ---- */
function pageMoney() {
  const m = moneyS(), fp = fundPace(), pays = fp.checks.slice(0, 8);
  const plan = d => m.plans[d] || {};
  const rs = rehabState();
  const rehabCard = `<section class="card span3" style="${rs.active ? "box-shadow:var(--shadow),inset 4px 0 0 var(--wine)" : ""}">
      <div class="chead"><h2>Financial rehab</h2><span class="lbl">${rs.done ? "complete" : rs.active ? "active · until the fund hits $3,000" : `starts ${fmt(parseD(rs.r.start), { weekday: "short", month: "short", day: "numeric" })} · ${rs.daysTo} days`}</span></div>
      <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr))">
        <div>
          <div class="lbl">Weekly cash cap</div>
          <div class="addrow" style="margin-top:4px"><input class="field tnum" id="rehab-cap" type="number" inputmode="decimal" placeholder="$ per week" value="${rs.r.cap ?? ""}" style="flex:1 1 100px"><input class="field" id="rehab-start" type="date" value="${esc(rs.r.start)}" style="flex:0 1 140px" aria-label="Start date"><button class="btn solid" data-act="rehab-save">Save</button></div>
          <div class="sub" style="margin-top:6px">Groceries, gas and life per week. Everything outside ${REHAB_ESSENTIALS.join(", ")} is a no.</div>
        </div>
        <div>
          <div class="lbl">This week</div>
          <div class="big tnum" style="margin-top:4px">${money(rs.spent)}${rs.r.cap !== null ? ` <small>/ ${money(rs.r.cap)}</small>` : ""}</div>
          ${rs.r.cap !== null ? `<div class="bar ${rs.left < 0 ? "wine" : rs.left < rs.r.cap * 0.25 ? "tan" : ""}" style="margin-top:6px"><i style="width:${Math.min(100, rs.spent / rs.r.cap * 100)}%"></i></div><div class="sub tnum" style="margin-top:4px">${rs.left < 0 ? money(-rs.left) + " over" : money(rs.left) + " left through " + fmt(addDays(WEEK0(), 6), { weekday: "short" })}</div>` : `<div class="sub">Set a cap to count it down.</div>`}
        </div>
        <div>
          <div class="lbl">Way out</div>
          <div class="big tnum" style="margin-top:4px">${money(rs.toGoal)}</div>
          <div class="sub">to $3,000 · rehab ends the day the fund gets there${moneyS().nextPayday ? "" : " · set your payday for the date"}</div>
        </div>
      </div>
      <form class="addrow" data-form="spend"><input class="field tnum" id="spend-amt" type="number" inputmode="decimal" placeholder="$" required style="flex:0 0 90px"><input class="field" id="spend-note" placeholder="What was it" autocomplete="off"><label style="display:flex;align-items:center;gap:6px;font-size:12px"><input type="checkbox" class="check" id="spend-ess" checked> Essential</label><button class="btn solid">Log spend</button></form>
      ${rs.thisWeek.length ? `<div class="rows">${[...rs.thisWeek].reverse().slice(0, 8).map(x => `<div class="row"><div class="t">${money(x.amount)}${x.note ? " · " + esc(x.note) : ""}<small>${fmt(parseD(x.date), { weekday: "short", month: "short", day: "numeric" })}${x.essential ? "" : ` · <span style="color:var(--wine);font-weight:600">non-essential</span>`}</small></div>${x.essential ? "" : `<button class="btn sm" data-act="spend-ess" data-id="${x.id}">Essential</button>`}<button class="x" data-act="spend-rm" data-id="${x.id}" aria-label="Remove">×</button></div>`).join("")}</div>` : ""}
    </section>`;
  return `<div class="grid g3">
    ${rehabCard}
    <section class="card"><div class="chead"><h2>Departure Fund</h2><span class="lbl">by Dec 31</span></div>
      <div class="big tnum">${m.balance === null ? "—" : money(m.balance)} <small>/ ${money(FUND_GOAL)}</small></div>
      <div class="fundbar" title="Stretch ${money(FUND_STRETCH)}"><i style="width:${Math.min(100, (m.balance || 0) / FUND_STRETCH * 100)}%"></i><b style="left:${FUND_GOAL / FUND_STRETCH * 100}%"></b></div>
      <div class="sub tnum">${money(fp.need)} to goal · stretch ${money(FUND_STRETCH)}</div>
      <div class="addrow"><input class="field tnum" id="fund-amt" type="number" inputmode="decimal" placeholder="$" aria-label="Amount"><button class="btn solid" data-act="fund-add">Add</button><button class="btn" data-act="fund-set">Set balance</button></div>
      <label class="lbl" for="pay-date">Next payday</label><div class="addrow"><input class="field" id="pay-date" type="date" value="${esc(m.nextPayday || "")}" style="flex:1 1 130px"><select class="field" id="pay-kind"><option value="living" ${m.nextKind === "living" ? "selected" : ""}>Living + savings check</option><option value="bills" ${m.nextKind === "bills" ? "selected" : ""}>Bills check</option></select></div></section>
    <section class="card"><div class="chead"><h2>Pace</h2><span class="lbl">${fp.onPace ? "on pace" : m.nextPayday ? "behind" : "needs payday"}</span></div>
      ${m.nextPayday ? `<div class="paylist"><span class="k">Checks left</span><span></span><span class="tnum">${fp.living} living · ${fp.bills} bills</span><span class="k">Plan</span><span class="sub">$700 × ${fp.living} + $100 × ${fp.bills}</span><span class="tnum">${money(fp.planned)}</span><span class="k">Need</span><span></span><span class="tnum">${money(fp.need)}</span><span class="k">Per living check</span><span class="sub">to hit $3,000 exactly</span><span class="tnum" style="color:${fp.perLiving > LIVING_SAVE ? "var(--wine)" : "inherit"}">${money(fp.perLiving)}</span></div>
      <div class="notice ${fp.onPace ? "" : "wine"}">${fp.onPace ? `The plan clears the goal with ${money(fp.planned - fp.need)} to spare. Keep the $700s.` : `Short by ${money(fp.short)}. Either ${money(fp.perLiving)} per living check, or ${money(fp.short / Math.max(1, fp.bills))} extra from each bills check.`}</div>` : `<div class="empty">Set your next payday and I'll do the math.</div>`}</section>
    <section class="card"><div class="chead"><h2>Savings history</h2><span class="lbl">${m.log.length}</span></div>
      <div class="rows">${[...m.log].reverse().slice(0, 10).map(l => `<div class="row"><div class="t">${l.amount >= 0 ? "Saved" : "Took out"} ${money(Math.abs(l.amount))}<small>${l.date}${l.note ? " · " + esc(l.note) : ""}</small></div></div>`).join("") || `<div class="empty">No deposits logged yet.</div>`}</div></section>
    <section class="card"><div class="chead"><h2>Bills</h2><span class="lbl tnum">${money((m.bills || []).reduce((a, b) => a + b.amount, 0))}/mo</span></div>
      <div class="rows">${[...(m.bills || [])].sort((a, b) => a.day - b.day).map(b => `<div class="row"><div class="t">${esc(b.name)}<small>due on the ${b.day}</small></div><span class="tnum">${money(b.amount)}</span><button class="x" data-act="bill-rm" data-id="${b.id}" aria-label="Remove">×</button></div>`).join("") || `<div class="empty">List your monthly bills so the bills-check math works.</div>`}</div>
      <form class="addrow" data-form="bill"><input class="field" id="bill-name" placeholder="Bill" required autocomplete="off"><input class="field tnum" id="bill-amt" type="number" placeholder="$" required style="flex:0 0 80px"><input class="field tnum" id="bill-day" type="number" min="1" max="31" placeholder="Day" style="flex:0 0 66px"><button class="btn solid">Add</button></form></section>
    <section class="card span2"><div class="chead"><h2>Money manager</h2><span class="sub">Claude, with your numbers</span></div>
      <div class="routines" style="grid-template-columns:repeat(2,minmax(0,1fr))"><button class="routine ${ROUTINES.payday.when(NOW) ? "hot" : ""}" data-act="routine" data-v="payday"><b>Payday Plan</b><span>${ROUTINES.payday.desc}</span></button><button class="routine ${ROUTINES.money.when(NOW) ? "hot" : ""}" data-act="routine" data-v="money"><b>Money Check-in</b><span>${ROUTINES.money.desc}</span></button></div>
      <div class="chips" style="padding-top:0">${["Can I afford $150 on workout clothes this week?", "How much should Rio cost me?", "Where does my next bills check go?", "What if I save $800 instead of $700?"].map(c => `<button class="chip" data-act="ask" data-v="${esc(c)}">${esc(c)}</button>`).join("")}</div>
      ${(m.checks || []).length ? `<div class="lbl">Checks logged</div><div class="rows">${[...m.checks].reverse().slice(0, 4).map(c => `<div class="row"><div class="t">${money(c.amount)}<small>${c.date} · ${c.kind}</small></div></div>`).join("")}</div>` : `<div class="stale">No bank is connected, so tell the manager your check amounts on payday and it does the split.</div>`}</section>
    <section class="card span3"><div class="chead"><h2>Paycheck split planner</h2><span class="sub">Each payday between now and Dec 31 · edit any amount</span></div>
      ${pays.length ? `<div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(230px,1fr))">${pays.map(p => { const pl = plan(p.date), save = pl.save ?? (p.kind === "living" ? LIVING_SAVE : BILLS_SKIM); return `<div class="trip"><div class="chead"><b style="font-weight:600;font-size:15px">${fmt(parseD(p.date), { weekday: "short", month: "short", day: "numeric" })}</b><span class="pill ${p.kind === "living" ? "b2" : "b0"}">${p.kind === "living" ? "Living + savings" : "Bills"}</span></div>
        <div class="split"><span>Check amount</span><input class="field tnum" type="number" data-plan="amount" data-d="${p.date}" value="${pl.amount ?? ""}" placeholder="$"><span>${p.kind === "living" ? "Departure Fund" : "Skim to fund"}</span><input class="field tnum" type="number" data-plan="save" data-d="${p.date}" value="${save}"><span>${p.kind === "living" ? "Groceries · gas · life" : "Bills due before next check"}</span><span class="tnum">${p.kind === "bills" ? money(billsDue(p.date)) : pl.amount ? money(pl.amount - save) : "—"}</span>${p.kind === "bills" && pl.amount ? `<span>Left after bills + skim</span><span class="tnum" style="color:${pl.amount - save - billsDue(p.date) < 0 ? "var(--wine)" : "inherit"}">${money(pl.amount - save - billsDue(p.date))}</span>` : ""}${pl.done ? `<span class="tot" style="grid-column:1/-1;color:var(--sage-ink)">Deposited ✓</span>` : `<button class="btn sm" style="grid-column:1/-1;justify-self:start" data-act="plan-done" data-d="${p.date}" data-v="${save}">Mark deposited (+${money(save)})</button>`}</div></div>`; }).join("")}</div>` : `<div class="empty">Set a payday first.</div>`}</section>
  </div>`;
}

/* ---- TRAVEL ---- */
function pageTravel() {
  const t = travel();
  return `<div class="grid">${t.trips.map(tr => { const days = dayDiff(NOW, parseD(tr.start)); const list = (arr, kind) => `<div class="rows">${arr.map(i => `<div class="row ${i.done ? "done" : ""}"><input type="checkbox" class="check" id="${kind}-${i.id}" data-act="trip-check" data-trip="${tr.id}" data-kind="${kind}" data-id="${i.id}" ${i.done ? "checked" : ""}><label class="t" for="${kind}-${i.id}">${esc(i.text)}</label><button class="x" data-act="trip-rm" data-trip="${tr.id}" data-kind="${kind}" data-id="${i.id}">×</button></div>`).join("") || `<div class="empty">Empty</div>`}</div><form class="addrow" data-form="trip-item" data-trip="${tr.id}" data-kind="${kind}"><input class="field" placeholder="${kind === "packing" ? "Pack…" : "Film…"}" required autocomplete="off"><button class="btn solid">Add</button></form>`;
    return `<section class="card"><div class="chead"><h2>${esc(tr.name)}</h2><span class="lbl">${fmt(parseD(tr.start), { month: "short", day: "numeric" })} – ${fmt(parseD(tr.end), { month: "short", day: "numeric" })}</span></div>
      <div class="trip"><div class="cd tnum">${days > 0 ? days + ' <small>days out</small>' : days <= 0 && ymd(NOW) <= tr.end ? "You're there" : "Done"}</div><div class="sub">Standby · ${tr.vacation ? "counts as vacation days on the calendar" : "weekend trip"}</div></div>
      <div class="lbl">Packing</div>${list(tr.packing, "packing")}

      <label class="lbl" for="sb-${tr.id}">Standby notes</label><textarea class="field" id="sb-${tr.id}" data-act="standby" data-trip="${tr.id}" placeholder="Loads, backup flights, who to call…">${esc(tr.standby || "")}</textarea>
      <button class="linkbtn" data-act="trip-rm-trip" data-trip="${tr.id}" style="align-self:flex-end">Remove trip</button></section>`; }).join("")}
    <section class="card"><div class="chead"><h2>New trip</h2></div><form class="frm" data-form="trip" style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><input class="field" name="name" placeholder="Where, and why" required style="grid-column:1/-1"><input class="field" name="start" type="date" required><input class="field" name="end" type="date" required><label style="grid-column:1/-1;display:flex;gap:8px;align-items:center;font-size:13px"><input type="checkbox" class="check" name="vacation" checked> Vacation days (travel filming allowed)</label><button class="btn solid" style="grid-column:1/-1;justify-self:start">Add trip</button></form></section>
  </div>`;
}

function pageReview() {

    <section class="card"><div class="chead"><h2>Weekly review</h2><span class="lbl">${weeks.length} archived</span></div>

      ${outline ? `<hr class="hr"><div class="lbl">${fmt(NOW, { month: "long" })} Vlog outline · ${fmt(new Date(outline.at), { month: "short", day: "numeric" })}</div><div class="review"><div class="txt">${esc(outline.text)}</div></div>` : ""}</section>
    <section class="card"><div class="chead"><h2>Archive</h2></div>

let sheetHtml = "";
function afterRender() {
  document.querySelectorAll("body > .detail").forEach(n => n.remove());
  if (sheetHtml) { const d = document.createElement("div"); d.innerHTML = sheetHtml; document.body.appendChild(d.firstElementChild); }
  const drop = $("#pin-drop");
  if (drop) { drop.ondragover = e => { e.preventDefault(); drop.style.borderColor = "var(--wine)"; }; drop.ondragleave = () => drop.style.borderColor = ""; drop.ondrop = e => { e.preventDefault(); const f = e.dataTransfer.files?.[0]; if (f) uploadPin(f); }; }
  document.querySelectorAll("[data-drag]").forEach(el => {
    el.addEventListener("dragstart", e => { e.dataTransfer.setData("text/plain", el.dataset.drag); el.classList.add("dragging"); });
    el.addEventListener("dragend", () => el.classList.remove("dragging"));
  });
  document.querySelectorAll("[data-drop],[data-stage]").forEach(z => {
    z.addEventListener("dragover", e => { e.preventDefault(); z.classList.add("over"); });
    z.addEventListener("dragleave", () => z.classList.remove("over"));
    z.addEventListener("drop", e => { e.preventDefault(); z.classList.remove("over"); const [kind, id] = (e.dataTransfer.getData("text/plain") || "").split(":"); if (!id) return;
      if (z.dataset.drop) moveItem(kind, id, z.dataset.drop); else if (z.dataset.stage && kind === "card") { const c = studio().cards.find(x => x.id === id); if (c) { setStage(c, z.dataset.stage); store.save("studio"); render(); } } });
  });
}
function moveItem(kind, id, date) {
  if (kind === "task") { const t = tasks().items.find(x => x.id === id); if (t) { t.date = date; store.save("tasks"); } }
  else { const c = studio().cards.find(x => x.id === id); if (c) { c.due = date; store.save("studio"); } }
  render();
}
async function uploadPin(file) {
  if (!assets) return; if (!/^image\//.test(file.type)) return toast("That file isn't an image.");
  toast("Uploading…");
  try { const r = await assets.upload(file); const k = "pins-" + MONTH(), p = store.get(k, { items: [] }); p.items.push({ id: uid(), assetId: r.id, caption: "" }); store.save(k); render(); toast("Pinned."); }
  catch (e) { toast(e.code === "too_large" ? "Over 20 MB; try a smaller photo." : "Upload failed: " + (e.message || e.code)); }
}
let toastT; function toast(m) { const t = $("#toast"); t.textContent = m; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 3200); }
function findGoal(id, wk) { const keys = wk ? [wk] : hhhWeekKeys(); for (const k of keys) { const g = store.get(k, { goals: [] }).goals.find(g => g.id === id); if (g) return [k, g]; } return []; }

/* ═══════════ EVENTS ═══════════ */
document.addEventListener("click", e => {

    case "idea-card": { const i = ideas().items.find(x => x.id === id); if (!i) break; studio().cards.push({ id: uid(), brand: i.brand, title: i.text, stage: "Idea", due: "", platform: "", note: "", footage: "", script: "", created: Date.now() }); ideas().items = ideas().items.filter(x => x.id !== id); store.save("studio"); store.save("ideas"); render(); toast("Card created."); break; }
    case "idea-rm": ideas().items = ideas().items.filter(x => x.id !== id); store.save("ideas"); render(); break;

    case "pt-done": case "pt-skip": case "pt-rm": { const x = pt().sessions.find(y => y.id === id); if (!x) break; if (a === "pt-rm") pt().sessions = pt().sessions.filter(y => y.id !== id); else if (a === "pt-skip") x.skipped = true; else { x.done = true; const k = "body-" + ymd(monday(parseD(x.date))); const b = store.get(k, { days: {} }); const d = b.days[x.date] || (b.days[x.date] = {}); d.lift = true; d.name = d.name || "PT session"; store.save(k); } store.save("pt"); render(); break; }

document.addEventListener("change", e => {
  const el = e.target, a = el.dataset.act, id = el.dataset.id;

document.addEventListener("submit", e => {

  else if (form === "year") { const text = $("#year-text").value.trim(); if (!text) return; store.get("yearly", { items: [] }).items.push({ id: uid(), text, done: false }); store.save("yearly"); render(); }

  else if (form === "trip") { const d = Object.fromEntries(new FormData(f).entries()); travel().trips.push({ id: uid(), name: d.name.trim(), start: d.start, end: d.end, vacation: !!d.vacation, packing: [], filming: [], standby: "" }); store.save("travel"); render(); }
});
